<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e8edf1;--surface:#f7f9fa;--ink:#14202b;--muted:#5d6b78;--line:#cfd7de;
  --accent:#2347d8;--accent-ink:#fff;--ok:#1f8a5b;--danger:#b8323a;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171d;--surface:#1a242d;--ink:#e8eef3;--muted:#8d9ba7;--line:#2b3946;
  --accent:#6b8bff;--accent-ink:#0b1220;--ok:#4cc38a;--danger:#ff7b83;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171d;--surface:#1a242d;--ink:#e8eef3;--muted:#8d9ba7;--line:#2b3946;
  --accent:#6b8bff;--accent-ink:#0b1220;--ok:#4cc38a;--danger:#ff7b83;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 var(--body);-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font:700 34px/1 var(--head);margin:8px 0 14px;letter-spacing:.01em}
h2{font:700 24px/1.1 var(--head);margin:0}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;position:sticky;top:8px;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);font:600 17px var(--head);padding:10px 0;border-radius:9px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:14px}
.muted{color:var(--muted);font-size:14px}
.ex{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.ex b{font-weight:600}
.tag{font:700 18px var(--head);color:var(--accent);white-space:nowrap}
.add{display:grid;grid-template-columns:1fr 64px 64px auto;gap:8px;margin-top:12px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:8px}
.sets .hd{font-size:13px;color:var(--muted)}
.sets .n{font:700 20px var(--head);color:var(--muted);text-align:center}
.chk{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:20px;color:var(--muted)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.done-row input{opacity:.6}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.pick{display:block;width:100%;text-align:left;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
.pick:hover{border-color:var(--accent)}
.vol{font:700 20px var(--head)}
@media (max-width:420px){.add{grid-template-columns:1fr 1fr 1fr}.add input:first-child{grid-column:1/-1}.add .btn{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <h1>Gym Tracker</h1>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="plans">Plany</button>
    <button role="tab" data-tab="train">Trening</button>
    <button role="tab" data-tab="hist">Historia</button>
  </nav>
  <div id="view"></div>
</main>

<script>
const KEY = 'gymtracker.v1';
let S = { plans: [], logs: [], session: null, tab: 'plans' };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $view = document.getElementById('view');

function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  $view.innerHTML = S.tab === 'plans' ? plansView() : S.tab === 'train' ? trainView() : histView();
  save();
}

/* ---------- Plany ---------- */
function plansView() {
  let h = `<div class="card"><div class="row">
    <input id="newPlan" placeholder="Nazwa planu, np. Push A" maxlength="40">
    <button class="btn" data-act="addPlan">Dodaj plan</button></div></div>`;
  if (!S.plans.length) h += `<div class="empty">Nie masz jeszcze planów. Dodaj pierwszy powyżej.</div>`;
  S.plans.forEach(p => {
    h += `<section class="card" data-plan="${p.id}">
      <div class="row between"><h2>${esc(p.name)}</h2>
        <div class="row"><button class="btn sm" data-act="start">Start</button>
        <button class="btn sm danger" data-act="delPlan" aria-label="Usuń plan">Usuń</button></div></div>`;
    if (!p.exercises.length) h += `<p class="muted">Brak ćwiczeń w tym planie.</p>`;
    p.exercises.forEach(e => {
      h += `<div class="ex" data-ex="${e.id}"><div><b>${esc(e.name)}</b></div>
        <div class="row"><span class="tag">${e.sets} × ${e.reps}</span>
        <button class="btn sm ghost" data-act="delEx" aria-label="Usuń ćwiczenie">✕</button></div></div>`;
    });
    h += `<div class="add">
      <input data-f="name" placeholder="Własne ćwiczenie" maxlength="50">
      <input data-f="sets" type="number" inputmode="numeric" min="1" max="20" placeholder="Serie">
      <input data-f="reps" type="number" inputmode="numeric" min="1" max="200" placeholder="Powt.">
      <button class="btn" data-act="addEx">Dodaj</button></div></section>`;
  });
  return h;
}

/* ---------- Trening ---------- */
function trainView() {
  const s = S.session;
  if (!s) {
    let h = `<p class="muted">Wybierz plan, żeby zacząć trening.</p>`;
    if (!S.plans.length) return h + `<div class="empty">Najpierw stwórz plan w zakładce „Plany”.</div>`;
    S.plans.forEach(p => h += `<button class="pick" data-act="startPick" data-plan="${p.id}">
      <h2>${esc(p.name)}</h2><span class="muted">${p.exercises.length} ćwiczeń</span></button>`);
    return h;
  }
  let h = `<div class="row between" style="margin-bottom:12px"><div><h2>${esc(s.name)}</h2>
    <span class="muted">${s.date}</span></div>
    <button class="btn sm danger" data-act="cancel">Anuluj</button></div>`;
  s.items.forEach((it, i) => {
    h += `<section class="card" data-i="${i}"><div class="row between"><h2>${esc(it.name)}</h2>
      <button class="btn sm ghost" data-act="rmItem" aria-label="Usuń ćwiczenie z treningu">✕</button></div>
      <div class="sets"><span></span><span class="hd">Ciężar (kg)</span><span class="hd">Powtórzenia</span><span></span>`;
    it.sets.forEach((st, j) => {
      h += `<span class="n">${j + 1}</span>
        <input data-f="kg" data-j="${j}" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(st.kg)}" placeholder="0">
        <input data-f="reps" data-j="${j}" type="number" inputmode="numeric" min="0" value="${esc(st.reps)}" placeholder="0">
        <button class="chk" data-act="toggle" data-j="${j}" aria-pressed="${st.done}" aria-label="Seria wykonana">✓</button>`;
    });
    h += `</div><div class="row" style="margin-top:10px">
      <button class="btn sm ghost" data-act="addSet">+ seria</button>
      <button class="btn sm ghost" data-act="rmSet">− seria</button></div></section>`;
  });
  h += `<div class="card"><div class="add" id="sessAdd">
      <input data-f="name" placeholder="Dodaj ćwiczenie do treningu" maxlength="50">
      <input data-f="sets" type="number" inputmode="numeric" min="1" max="20" placeholder="Serie">
      <input data-f="reps" type="number" inputmode="numeric" min="1" max="200" placeholder="Powt.">
      <button class="btn" data-act="addItem">Dodaj</button></div></div>
    <button class="btn" style="width:100%;padding:14px" data-act="finish">Zakończ i zapisz trening</button>`;
  return h;
}

/* ---------- Historia ---------- */
function volume(items) {
  return items.reduce((a, it) => a + it.sets.reduce((b, s) => b + (+s.kg || 0) * (+s.reps || 0), 0), 0);
}
function histView() {
  if (!S.logs.length) return `<div class="empty">Brak zapisanych treningów. Skończ pierwszy, a pojawi się tutaj.</div>`;
  return S.logs.map(l => `<section class="card" data-log="${l.id}">
    <div class="row between"><div><h2>${esc(l.name)}</h2><span class="muted">${l.date}</span></div>
    <div style="text-align:right"><div class="vol">${Math.round(volume(l.items))} kg</div><span class="muted">łączny wolumen</span></div></div>
    ${l.items.map(it => `<div class="ex"><b>${esc(it.name)}</b>
      <span class="muted" style="text-align:right">${it.sets.map(s => `${+s.kg || 0}×${+s.reps || 0}`).join(' · ')}</span></div>`).join('')}
    <div style="margin-top:10px"><button class="btn sm danger" data-act="delLog">Usuń wpis</button></div></section>`).join('');
}

/* ---------- Zdarzenia ---------- */
const num = (v, d) => { const n = parseInt(v, 10); return n > 0 ? n : d; };
const today = () => new Date().toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
function startSession(plan) {
  S.session = { name: plan.name, date: today(), items: plan.exercises.map(e => ({
    name: e.name, sets: Array.from({ length: e.sets }, () => ({ kg: '', reps: e.reps, done: false })) })) };
  S.tab = 'train';
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.tab; render();
});

$view.addEventListener('input', e => {
  const t = e.target, card = t.closest('[data-i]');
  if (card && S.session && t.dataset.j !== undefined) {
    S.session.items[card.dataset.i].sets[t.dataset.j][t.dataset.f] = t.value; save();
  }
});

$view.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, box = b.closest('section,.card,.add');
  const planEl = b.closest('[data-plan]');
  const plan = planEl && S.plans.find(p => p.id === planEl.dataset.plan);
  const val = f => (box.querySelector(`[data-f="${f}"]`) || {}).value || '';
  const itemEl = b.closest('[data-i]'), item = itemEl && S.session && S.session.items[itemEl.dataset.i];

  if (act === 'addPlan') {
    const n = document.getElementById('newPlan').value.trim(); if (!n) return;
    S.plans.push({ id: uid(), name: n, exercises: [] });
  } else if (act === 'delPlan') {
    if (!confirm(`Usunąć plan „${plan.name}”?`)) return;
    S.plans = S.plans.filter(p => p !== plan);
  } else if (act === 'addEx') {
    const n = val('name').trim(); if (!n) return;
    plan.exercises.push({ id: uid(), name: n, sets: num(val('sets'), 3), reps: num(val('reps'), 10) });
  } else if (act === 'delEx') {
    const id = b.closest('[data-ex]').dataset.ex; plan.exercises = plan.exercises.filter(x => x.id !== id);
  } else if (act === 'start' || act === 'startPick') {
    if (S.session && !confirm('Masz trwający trening. Zacząć nowy i porzucić obecny?')) return;
    startSession(plan);
  } else if (act === 'cancel') {
    if (!confirm('Porzucić trwający trening?')) return; S.session = null;
  } else if (act === 'toggle') {
    const st = item.sets[b.dataset.j]; st.done = !st.done;
  } else if (act === 'addSet') {
    const last = item.sets[item.sets.length - 1] || { kg: '', reps: 10 };
    item.sets.push({ kg: last.kg, reps: last.reps, done: false });
  } else if (act === 'rmSet') {
    if (item.sets.length > 1) item.sets.pop();
  } else if (act === 'rmItem') {
    S.session.items.splice(itemEl.dataset.i, 1);
  } else if (act === 'addItem') {
    const n = val('name').trim(); if (!n) return;
    S.session.items.push({ name: n, sets: Array.from({ length: num(val('sets'), 3) }, () => ({ kg: '', reps: num(val('reps'), 10), done: false })) });
  } else if (act === 'finish') {
    const items = S.session.items
      .map(it => ({ name: it.name, sets: it.sets.filter(s => s.done).map(s => ({ kg: s.kg, reps: s.reps })) }))
      .filter(it => it.sets.length);
    if (!items.length) { alert('Zaznacz ✓ przy wykonanych seriach, żeby zapisać trening.'); return; }
    S.logs.unshift({ id: uid(), name: S.session.name, date: S.session.date, items });
    S.session = null; S.tab = 'hist';
  } else if (act === 'delLog') {
    if (!confirm('Usunąć ten wpis z historii?')) return;
    const id = b.closest('[data-log]').dataset.log; S.logs = S.logs.filter(l => l.id !== id);
  }
  render();
});

$view.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const btn = e.target.closest('.row,.add'); const go = btn && btn.querySelector('.btn[data-act]');
  if (go && /^(addPlan|addEx|addItem)$/.test(go.dataset.act)) go.click();
});

render();
</script>
</body>
</html>
